<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>HODL Wallet</title>
</head>
<body>
    <div class="monitor">
        <div class="screen">
            <div class="crt">
                <main id="term" class="term" aria-label="HODL Wallet terminal">
                    <div id="out" role="log" aria-live="polite" aria-relevant="additions"></div>
                </main>
                <div class="status" aria-label="Session">
                    <span class="tag">HODL/WALLET</span>
                    <span class="wide">tty1</span>
                    <span id="session-state" class="state">LOCKED</span>
                    <span id="network" class="network"></span>
                    <span class="fill"></span>
                    <span class="hints wide"><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>Enter</kbd> select · <kbd>Esc</kbd> back · <kbd>Ctrl+C</kbd> lock</span>
                </div>
                <div class="ov scan" aria-hidden="true"></div>
                <div class="ov roll" aria-hidden="true"></div>
                <div class="ov flicker" aria-hidden="true"></div>
                <div class="ov vignette" aria-hidden="true"></div>
                <div class="ov glass" aria-hidden="true"></div>
            </div>
        </div>
    </div>
    <div class="strip">
        <div class="brand"><span class="led" aria-hidden="true"></span><span class="brand-name">Terminal</span></div>
        <div class="dials" role="group" aria-label="Display">
            <button id="preset" class="key" type="button" aria-label="Change phosphor color">P1:GRN</button>
            <button id="scanlines" class="key" type="button" aria-pressed="true" aria-label="Scanlines and glow">FX:ON</button>
            <button id="curvature" class="key" type="button" aria-pressed="true" aria-label="Screen curvature, bezel and flicker">CRT:ON</button>
            <button id="sweep" class="key" type="button" aria-label="Rolling sweep bar: full, subtle or off">SWP:FULL</button>
            <button id="sound" class="key" type="button" aria-pressed="false" aria-label="Keyboard sound">SND:OFF</button>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
